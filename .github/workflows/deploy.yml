name: Deploy Streamhit App

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 209.74.67.24
          username: lcsyxfen
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== 1. Starting Production Deployment ==="
            cd ~/streamhit.lc-synergy.ltd/
            git fetch origin
            git reset --hard origin/main
            chmod +x streamhitupdate.sh
            ./streamhitupdate.sh
            echo "=== 2. Deployment Finished Successfully ==="
