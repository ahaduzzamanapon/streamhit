name: Deploy Streamhit App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 209.74.67.24
          username: lcsyxfen
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Searching for all deployments in home directory..."
            for gitdir in $(find ~ -maxdepth 3 -name ".git" 2>/dev/null); do
              appdir=$(dirname "$gitdir")
              echo "Checking $appdir..."
              cd "$appdir"
              remote_url=$(git config --get remote.origin.url || true)
              if echo "$remote_url" | grep -qi "streamhit"; then
                echo "--> Updating $appdir from origin main..."
                git fetch origin
                git reset --hard origin/main
                touch passenger_wsgi.py 2>/dev/null || true
                mkdir -p tmp 2>/dev/null || true
                touch tmp/restart.txt 2>/dev/null || true
                if [ -f "streamhitupdate.sh" ]; then
                  chmod +x streamhitupdate.sh
                  ./streamhitupdate.sh || true
                fi
              fi
            done
