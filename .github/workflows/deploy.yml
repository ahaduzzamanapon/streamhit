name: Deploy Streamhit App

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 209.74.67.24
          username: lcsyxfen
          port: 21098
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== 0. Killing stale background processes to free CPU ==="
            pkill -9 -f "cp -r" 2>/dev/null || true
            pkill -f "sitemap_generator.py" 2>/dev/null || true

            echo "=== 1. Updating streamhit.lc-synergy.ltd ==="
            cd ~/streamhit.lc-synergy.ltd/
            git fetch origin
            git reset --hard origin/main
            touch passenger_wsgi.py
            mkdir -p tmp
            touch tmp/restart.txt
            chmod +x streamhitupdate.sh
            ./streamhitupdate.sh || true
            rm -f /tmp/streamhit_active_users.db* ~/active_users.db* ~/streamhit.lc-synergy.ltd/active_users.db* 2>/dev/null || true

            echo "=== 2. Finding and Syncing all Python/Passenger apps (including nxly.online) ==="
            find ~ -maxdepth 3 \( -name "main.py" -o -name "passenger_wsgi.py" \) 2>/dev/null | while read -r filepath; do
              appdir=$(dirname "$filepath")
              if [ "$appdir" != "$HOME/streamhit.lc-synergy.ltd" ]; then
                echo "Fast syncing to $appdir..."
                if [ -d "$appdir/.git" ]; then
                  cd "$appdir" && git fetch origin 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
                else
                  cp -f ~/streamhit.lc-synergy.ltd/*.py "$appdir/" 2>/dev/null || true
                  mkdir -p "$appdir/public"
                  cp -f ~/streamhit.lc-synergy.ltd/public/*.html "$appdir/public/" 2>/dev/null || true
                  cp -f ~/streamhit.lc-synergy.ltd/public/*.css "$appdir/public/" 2>/dev/null || true
                  cp -f ~/streamhit.lc-synergy.ltd/public/*.js "$appdir/public/" 2>/dev/null || true
                fi
                touch "$appdir/passenger_wsgi.py" 2>/dev/null || true
                mkdir -p "$appdir/tmp" 2>/dev/null || true
                touch "$appdir/tmp/restart.txt" 2>/dev/null || true
              fi
            done

            echo "=== 3. Deployment successful ==="
            exit 0
