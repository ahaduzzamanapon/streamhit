<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body class="watch-page-body">
<div class="app-container">
  <aside class="sidebar">
    <div class="brand" onclick="window.location.href='/'">
      <div class="play-logo"><i class="fa-solid fa-play"></i></div>
      <span class="logo-text">Stream<span>fit</span></span>
    </div>
    <nav class="nav-menu">
      <div class="menu-label">Navigation</div>
      <ul>
        <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="/movies"><i class="fa-solid fa-film"></i> Movies</a></li>
        <li><a href="/tv"><i class="fa-solid fa-tv"></i> TV Series</a></li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">
    <header class="header">
      <div class="mobile-brand" onclick="window.location.href='/'">
        <div class="play-logo" style="width:28px;height:28px;font-size:11px;"><i class="fa-solid fa-play"></i></div>
        <span class="logo-text" style="font-size:17px;">Stream<span>fit</span></span>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
        <button id="searchBtn">Search</button>
      </div>
      <div class="header-controls">
        <div class="language-selector" onclick="window.history.back()" style="cursor:pointer;">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back</span>
        </div>
      </div>
    </header>

    <!-- Loading -->
    <div id="watchPageLoading" class="watch-loading-container" <!-- SSR_LOADING_STYLE -->>
      <div class="loading-spinner"></div>
      <p>Loading stream...</p>
    </div>

    <!-- Watch Content -->
    <div class="watch-wrapper" id="watchWrapper" <!-- SSR_WRAPPER_STYLE -->>
      <div class="watch-cinema-grid">

        <!-- ── PLAYER COLUMN ─────────────────────────────────────── -->
        <div class="cinema-player-section">
          <div class="player-wrapper" id="playerWrapperEl">
            <!-- Plyr Video -->
            <video id="player" playsinline></video>

            <!-- Loading Overlay -->
            <div class="player-loader-overlay" id="playerLoaderOverlay">
              <div class="player-spinner"></div>
              <span><i class="fa-solid fa-spinner fa-spin" style="margin-right:8px;"></i>Loading stream...</span>
            </div>

            <!-- Player Ambient Glow -->
            <div class="player-ambient-glow" id="playerAmbientGlow"></div>

            <!-- Player Header Overlay (Title + Quick Actions) -->
            <div class="player-header-overlay" id="playerHeaderOverlay">
              <button class="player-back-btn" id="playerBackBtn" title="Back / Exit Fullscreen">
                <i class="fa-solid fa-arrow-left"></i>
              </button>
              <div class="player-title-info">
                <span id="playerMediaCategory">Streaming</span>
                <h2 id="playerMediaTitle">Loading...</h2>
              </div>
              <div class="player-header-actions">
                <!-- Aspect Ratio Toggle: Fit vs Fill -->
                <button class="player-header-action-btn" id="fsAspectBtn" title="Aspect Ratio (Fit / Zoom Fill)">
                  <i class="fa-solid fa-expand"></i> <span class="action-btn-text">Fit</span>
                </button>
                <!-- Fullscreen Episode Drawer (TV series) -->
                <button class="player-header-action-btn" id="fsEpisodesBtn" title="Episodes" style="display:none;">
                  <i class="fa-solid fa-list-ol"></i> <span class="action-btn-text">Episodes</span>
                </button>
                <!-- Theater Mode Toggle (Desktop) -->
                <button class="player-header-action-btn" id="theaterModeBtn" title="Theater Mode">
                  <i class="fa-solid fa-table-cells-large" id="theaterModeIcon"></i>
                </button>
              </div>
            </div>

            <!-- Center Play/Pause Splash -->
            <div class="center-playback-splash" id="centerPlaybackSplash">
              <i class="fa-solid fa-play"></i>
            </div>

            <!-- Fullscreen Episodes Drawer (TV Series) -->
            <div class="fs-episodes-drawer" id="fsEpisodesDrawer">
              <div class="fs-drawer-header">
                <div class="fs-drawer-title"><i class="fa-solid fa-list-ul"></i> Select Episode</div>
                <button class="fs-drawer-close" id="fsEpisodesDrawerClose"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="fs-drawer-season-picker" id="fsDrawerSeasonPicker"></div>
              <div class="fs-drawer-episode-grid scroll-y" id="fsDrawerEpisodeGrid"></div>
            </div>

            <!-- Seek Feedback Overlays -->
            <div class="seek-feedback seek-feedback-left" id="seekFeedbackLeft">
              <div class="seek-icon-circle">
                <i class="fa-solid fa-backward-fast"></i>
                <span class="seek-seconds-text">-10s</span>
              </div>
            </div>
            <div class="seek-feedback seek-feedback-right" id="seekFeedbackRight">
              <div class="seek-icon-circle">
                <i class="fa-solid fa-forward-fast"></i>
                <span class="seek-seconds-text">+10s</span>
              </div>
            </div>

            <!-- Next Episode Overlay -->
            <div class="next-episode-overlay" id="nextEpisodeOverlay">
              <div class="next-overlay-content">
                <div>
                  <div class="next-title-label">Up Next</div>
                  <div class="next-episode-title" id="nextEpisodeTitle">Next Episode</div>
                </div>
                <div style="display:flex;align-items:center;gap:14px;">
                  <div class="next-countdown-container">
                    <svg class="next-countdown-circle" viewBox="0 0 76 76">
                      <circle class="bg-circle" cx="38" cy="38" r="36"/>
                      <circle class="progress-circle" id="nextCountdownCircleProgress" cx="38" cy="38" r="36"/>
                    </svg>
                    <div class="next-countdown-text" id="nextCountdownText">10</div>
                  </div>
                  <div class="next-btn-group" style="flex-direction:column;">
                    <button class="next-btn-play" id="nextEpisodePlayBtn">
                      <i class="fa-solid fa-play"></i> Play Now
                    </button>
                    <button class="next-btn-cancel" id="nextEpisodeCancelBtn">Cancel</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Resume Toast -->
            <div class="resume-toast" id="resumeToast">
              <i class="fa-solid fa-clock-rotate-left" style="color:var(--accent);font-size:16px;"></i>
              <span id="resumeToastText">Resumed from 12:34</span>
              <button class="resume-toast-btn secondary" id="resumeToastStartOverBtn">Start Over</button>
              <button class="resume-toast-btn" id="resumeToastDismissBtn">OK</button>
            </div>
          </div>

          <!-- TV Quick Prev/Next Episode Bar (Below Player) -->
          <div class="tv-quick-nav-bar" id="tvQuickNavBar" style="display:none;">
            <button class="quick-nav-btn" id="quickPrevEpBtn" title="Previous Episode">
              <i class="fa-solid fa-backward-step"></i> <span>Prev Ep</span>
            </button>
            <div class="quick-nav-current" id="quickNavCurrentEp">
              <span class="quick-nav-badge">Playing</span>
              <span class="quick-nav-label" id="quickNavLabel">Episode 01</span>
            </div>
            <button class="quick-nav-btn primary" id="quickNextEpBtn" title="Next Episode">
              <span>Next Ep</span> <i class="fa-solid fa-forward-step"></i>
            </button>
          </div>

          </div>
        </div>

        <!-- ── META BELOW PLAYER ─────────────────────────────────── -->
        <div class="cinema-meta-section">
          <div class="meta-header-row">
            <div class="meta-title-col">
              <h1 id="watchMetaTitle"><!-- SSR_TITLE_TEXT --></h1>
              <div class="meta-row">
                <span class="rating-badge" id="watchMetaRating"><i class="fa-solid fa-star"></i> <!-- SSR_RATING --></span>
                <span id="watchMetaYear"><!-- SSR_YEAR --></span>
                <span id="watchMetaCountry"><!-- SSR_COUNTRY --></span>
                <span id="watchMetaDuration"><!-- SSR_DURATION --></span>
              </div>
            </div>
            <div class="meta-actions">
              <button id="watchBookmarkBtn" class="meta-action-btn" title="Add to Watchlist">
                <i class="fa-regular fa-bookmark"></i> <span>Watchlist</span>
              </button>
              <a id="watchDownloadBtn" href="/download" class="meta-action-btn" style="text-decoration:none;">
                <i class="fa-solid fa-arrow-down-to-bracket"></i> <span>Download App</span>
              </a>
              <button id="watchShareBtn" class="meta-action-btn">
                <i class="fa-solid fa-share-nodes"></i> <span>Share</span>
              </button>
            </div>
          </div>
          <p id="watchDescription" class="watch-synopsis"><!-- SSR_DESCRIPTION --></p>
        </div>

        <!-- ── MORE LIKE THIS / RECOMMENDATIONS ─────────────────── -->
        <div class="cinema-desc-section" style="margin:0 24px 24px;">
          <div class="section-header" style="margin-bottom:14px;">
            <h2 style="font-size:16px; font-weight:700; color:var(--text-main); display:flex; align-items:center; gap:8px;">
              <i class="fa-solid fa-sparkles" style="color:#00F0FF;"></i> More Like This
            </h2>
          </div>
          <div id="watchRecommendationsGrid">
            <!-- SSR_RECOMMENDATIONS -->
          </div>
        </div>

        <!-- ── RESOURCES SIDEBAR ─────────────────────────────────── -->
        <div class="resources-container" id="resourcesContainer">
          <div class="resources-header">
            <span>Resources <span class="upload-by">By Streamfit</span></span>
            <i class="fa-solid fa-circle-question info-icon"></i>
          </div>

          <!-- Dual Selectors: Dub + Season side-by-side -->
          <div class="resources-controls-row">
            <div class="dub-selector-wrapper" id="watchDubSelectorGroup" style="display:none;">
              <select id="dubLanguageSelect" class="custom-select"></select>
            </div>
            <div class="season-selector-wrapper" id="watchSeasonSelectorGroup" style="display:none;">
              <select id="seasonSelect" class="custom-select"></select>
            </div>
          </div>

          <!-- TV Season + Episode Selector -->
          <div class="tv-episode-selector" id="watchTvSelector" style="display:none;">
            <div class="season-tabs" id="watchSeasonTabs" style="display:none;"></div>
            <div class="episode-grid scroll-y" id="watchEpisodeGrid"></div>
          </div>

          <!-- Live Stream Links (sports/tv) -->
          <div class="live-stream-selector" id="watchLiveStreamSelector" style="display:none;"></div>
        </div>

      </div>
    </div>
  </main>
</div>

<!-- Mobile Bottom Nav -->
<div class="mobile-navigation-bar">
  <a href="/" class="nav-item" id="mobileNavHome"><i class="fa-solid fa-house"></i><span>Home</span></a>
  <a href="/movies" class="nav-item" id="mobileNavMovies"><i class="fa-solid fa-film"></i><span>Movies</span></a>
  <a href="/tv" class="nav-item" id="mobileNavTv"><i class="fa-solid fa-tv"></i><span>TV</span></a>
  <a href="/download" class="nav-item download-app-btn" id="mobileNavDownload"><i class="fa-solid fa-arrow-down-to-bracket"></i><span>Get App</span></a>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>

<script src="/app.js?v=6.9"></script>

</body>
</html>
